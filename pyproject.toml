[tool.poetry]
name = "products-rag"
version = "0.1.0"
description = "RAG application for grocery product search using LangGraph and Streamlit"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
streamlit = "^1.64.0"
langgraph = "^1.2.11"
langchain = "^1.4.2"
langchain-openai = "^1.6.2"
langchain-chroma = "^1.1.0"
langchain-community = "^0.4.2"
python-dotenv = "^1.2.3"
chromadb = "^1.5.9"
pydantic = "^2.13.5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.12.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
